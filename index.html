<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Weather Applet</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen">

  <h1 class="text-3xl font-bold mb-6">Віджет погоди для Рівного</h1>

  <div id="weather" class="w-full max-w-md p-6 bg-white rounded-2xl shadow-lg">
    <div id="weatherButton" class="mb-4 text-center"></div>
    <div id="weatherContainer" class="mt-4"></div>
  </div>

  <script>

    const button = document.createElement('button');
    button.innerText = 'Показати погоду';
    button.className = 'bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl';

    document.getElementById('weatherButton').appendChild(button);

    button.addEventListener('click', () => {
      const weatherFrame = document.createElement('iframe');
      weatherFrame.src = 'https://www.meteoblue.com/en/weather/widget/three/rivne_ukraine_695594?geoloc=fixed&nocurrent=0&noforecast=0&days=3&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&layout=image';
      weatherFrame.width = '100%';
      weatherFrame.height = '400';
      weatherFrame.className = 'rounded-xl shadow-md';

      const container = document.getElementById('weatherContainer');
      container.innerHTML = ''; 
      container.appendChild(weatherFrame);
    });
  </script>

</body>

</html>
